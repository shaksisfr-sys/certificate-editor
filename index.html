<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RPG Certificate Editor</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Unicase:wght@500;700&family=Marck+Script&family=Press+Start+2P&family=UnifrakturMaguntia&family=Cinzel:wght@700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}body{margin:0;background:#0f172a;color:#f1f5f9;font-family:Arial,sans-serif}
.font-gothic{font-family:'UnifrakturMaguntia',cursive}.font-slavic{font-family:'Cormorant Unicase',serif}
.font-handwrite{font-family:'Marck Script',cursive}.font-pixel{font-family:'Press Start 2P',monospace}.font-cinzel{font-family:'Cinzel',serif}
.canvas{position:relative;flex:none;overflow:hidden;box-shadow:0 20px 25px #0008;user-select:none;background-color:#f4ecd8;background-image:radial-gradient(#e2d3b4 2px,transparent 2px);background-size:16px 16px}
.bg-preset-darkmagic{background:linear-gradient(135deg,#1a102f,#05020a)}.bg-preset-scifi{background:#0d1117;border:2px solid #30363d}
.bg-preset-royal{background:linear-gradient(135deg,#2b0c0c,#4a1515 50%,#1a0505)}
.draggable{position:absolute;cursor:move;touch-action:none;white-space:pre-wrap;max-width:95%;overflow-wrap:anywhere}
.draggable.active{outline:2px dashed #eab308;outline-offset:4px}
.panel{background:#1e293b;border:1px solid #334155;border-radius:9px;padding:14px}
input,select,textarea,button{font:inherit}input[type=text],input[type=number],select,textarea{background:#0f172a;color:#f1f5f9;border:1px solid #475569;border-radius:5px;padding:6px;min-width:0;resize:vertical}
button{cursor:pointer;border-radius:5px;padding:7px 10px}
@media(max-width:900px){#workspace{flex-direction:column!important}aside{width:100%!important;max-height:none!important}main{min-height:500px}}
</style>
</head>
<body>
<header style="background:#1e293b;border-bottom:1px solid #334155;padding:12px 18px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;position:sticky;top:0;z-index:5">
<strong style="font-size:20px;color:#fbbf24">📜 RPG Certificate Editor</strong>
<div style="display:flex;gap:8px;flex-wrap:wrap">
<select id="templatePreset" onchange="applyPreset(this.value)">
<option value="">— Быстрые пресеты —</option><option value="hogwarts">🧙 Школа Магии</option><option value="military">⚔ Военный Указ</option><option value="scifi">🚀 Лицензия Пилота</option><option value="guild">🛡 Свидетельство Гильдии</option>
</select>
<button style="background:#d97706;color:#111827;font-weight:bold" onclick="exportPNG()">💾 Скачать PNG</button>
<button style="background:#4338ca" onclick="openSupabaseModal()">⚙️ Supabase</button>
<button style="background:#0891b2" onclick="saveToSupabase()">☁️ Сохранить</button>
<button style="background:#0f766e" onclick="loadFromSupabase()">📂 Загрузить</button>
</div></header>

<div id="workspace" style="display:flex;min-height:calc(100vh - 60px)">
<aside style="width:370px;flex:none;background:#1e293b;border-right:1px solid #334155;padding:16px;display:flex;flex-direction:column;gap:14px;overflow:auto">
<section class="panel">
<h3 style="color:#fbbf24;margin:0 0 12px">🖼️ 1. Фон и формат</h3>
<label style="display:block;font-size:12px;color:#cbd5e1;margin-bottom:5px">Загрузить фон</label><input type="file" id="bgUploader" accept="image/*" onchange="handleBgUpload(event)" style="width:100%;font-size:12px">
<div style="display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:10px">
<button style="background:#fef3c7;color:#111827" onclick="setPresetBg('parchment')">Пергамент</button>
<button style="background:#3b0764;color:#e9d5ff" onclick="setPresetBg('darkmagic')">Тёмная магия</button>
<button style="background:#0f172a;color:#67e8f9" onclick="setPresetBg('scifi')">Sci-Fi</button>
<button style="background:#450a0a;color:#fde68a" onclick="setPresetBg('royal')">Королевский</button>
</div>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px">
<label style="font-size:12px">Формат<select id="aspectRatio" onchange="changeFormat()" style="width:100%;margin-top:4px"><option value="landscape">A4 альбомный</option><option value="portrait">A4 книжный</option><option value="square">Квадрат</option></select></label>
<label style="font-size:12px">Затенение<input type="range" id="bgOverlay" min="0" max=".8" step=".05" value="0" oninput="updateOverlay(this.value)" style="width:100%;margin-top:8px"></label>
</div></section>

<section class="panel">
<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px"><h3 style="color:#fbbf24;margin:0">✍️ 2. Текстовые элементы</h3><button style="background:#92400e" onclick="addText()">+ Текст</button></div>
<div id="textControlsList" style="display:flex;flex-direction:column;gap:10px;max-height:48vh;overflow:auto"></div>
</section>

<section class="panel">
<h3 style="color:#fbbf24;margin:0 0 10px">🛡️ 3. Печать / герб</h3>
<label style="font-size:12px;color:#cbd5e1">Загрузить изображение печати</label><input type="file" id="sealUploader" accept="image/*" onchange="handleSealUpload(event)" style="width:100%;font-size:12px;margin:6px 0 10px">
<div style="display:flex;gap:6px"><button style="background:#7f1d1d" onclick="setBuiltInSeal('wax')">Красный воск</button><button style="background:#92400e" onclick="setBuiltInSeal('gold')">Золото</button><button style="background:#581c87" onclick="setBuiltInSeal('arcane')">Магия</button></div>
<div id="sealAdjustments" style="margin-top:12px">
<label style="display:block;font-size:12px">Размер <span id="sealSizeVal">130px</span><input type="range" min="50" max="300" value="130" oninput="updateSealSize(this.value)" style="width:100%"></label>
<label style="display:block;font-size:12px;margin-top:8px">Поворот <span id="sealRotateVal">0°</span><input type="range" min="-180" max="180" value="0" oninput="updateSealRotate(this.value)" style="width:100%"></label>
<button style="background:#7f1d1d;margin-top:8px" onclick="removeSeal()">Удалить печать</button>
</div></section>
</aside>

<main style="flex:1;min-width:0;background:#020617;padding:24px;display:flex;justify-content:center;align-items:center;overflow:auto">
<div id="certificateContainer" class="canvas" style="width:800px;height:565px">
<div id="darkOverlay" style="position:absolute;inset:0;background:#000;opacity:0;pointer-events:none"></div>
<div id="bgImageHolder" style="position:absolute;inset:0;background-size:cover;background-position:center;pointer-events:none"></div>
<div id="layersContainer" style="position:absolute;inset:0"></div>
</div></main></div>

<div id="supabaseModal" style="display:none;position:fixed;inset:0;background:#000c;z-index:20;align-items:center;justify-content:center;padding:16px">
<div class="panel" style="width:min(440px,100%);background:#1e293b">
<h3 style="color:#fbbf24;margin-top:0">Настройка Supabase</h3>
<p style="font-size:12px;color:#cbd5e1">Параметры сохраняются только в этом браузере. Нужна таблица certificates с колонками id (int8), title (text), data (jsonb), created_at (timestamptz).</p>
<label style="font-size:12px">Project URL<input id="sbUrl" type="text" style="width:100%;margin:5px 0 10px" placeholder="https://xxxx.supabase.co"></label>
<label style="font-size:12px">Anon / Public Key<input id="sbKey" type="password" style="width:100%;margin:5px 0 12px" placeholder="Public anon key"></label>
<div style="display:flex;justify-content:flex-end;gap:8px"><button style="background:#475569" onclick="closeSupabaseModal()">Отмена</button><button style="background:#d97706;color:#111827" onclick="saveSupabaseCredentials()">Сохранить ключи</button></div>
</div></div>
<div id="loadModal" style="display:none;position:fixed;inset:0;background:#000c;z-index:21;align-items:center;justify-content:center;padding:16px">
<div class="panel" style="width:min(520px,100%);background:#1e293b"><div style="display:flex;justify-content:space-between"><h3 style="margin-top:0;color:#67e8f9">Сохранённые грамоты</h3><button onclick="closeLoadModal()">✕</button></div><div id="supabaseItemsList"></div></div></div>

<script>
let appState={
 format:'landscape',bgPreset:'parchment',customBgUrl:null,overlayOpacity:0,
 elements:[
  {id:'el-1',content:'УКАЗ И НАГРАДА',font:'font-slavic',size:36,color:'#4a1515',x:250,y:40,bold:true,italic:false,align:'center'},
  {id:'el-2',content:'Настоящим подтверждается, что храбрый воин',font:'font-handwrite',size:22,color:'#2b0c0c',x:180,y:120,bold:false,italic:false,align:'center'},
  {id:'el-3',content:'РИЧАРД ЛЕОНОР',font:'font-gothic',size:48,color:'#851414',x:220,y:180,bold:true,italic:false,align:'center'},
  {id:'el-4',content:'проявил нечеловеческую отвагу при защите Цитадели от полчищ скверны и награждается Высшим Орденом Короны.',font:'font-slavic',size:18,color:'#1a0505',x:100,y:270,bold:false,italic:false,align:'center'}
 ],
 seal:{visible:true,type:'wax',customUrl:null,x:620,y:380,size:130,rotate:-12}
};
let activeElementId=null,supabaseClient=null,drag=null;
const sealSVG={
 wax:'<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="45" fill="#851414" stroke="#4a0808" stroke-width="4"/><circle cx="50" cy="50" r="38" fill="none" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4 2"/><path d="M50 20 L58 38 L78 38 L62 50 L68 68 L50 56 L32 68 L38 50 L22 38 L42 38 Z" fill="#f59e0b"/></svg>',
 gold:'<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="46" fill="#d97706" stroke="#78350f" stroke-width="3"/><circle cx="50" cy="50" r="32" fill="none" stroke="#78350f" stroke-width="2"/><text x="50" y="60" font-size="32" text-anchor="middle" fill="#78350f">♛</text></svg>',
 arcane:'<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="45" fill="#4c1d95" stroke="#2e1065" stroke-width="4"/><polygon points="50,15 80,75 20,75" fill="none" stroke="#c084fc" stroke-width="3"/><polygon points="50,85 80,25 20,25" fill="none" stroke="#c084fc" stroke-width="3"/><circle cx="50" cy="50" r="12" fill="#c084fc"/></svg>'
};
function $(id){return document.getElementById(id)}
function renderApp(){renderCanvas();renderControls()}

function renderCanvas(){
 const c=$('certificateContainer'),layers=$('layersContainer');
 const sizes={landscape:[800,565],portrait:[565,800],square:[600,600]};
 c.style.width=sizes[appState.format][0]+'px';c.style.height=sizes[appState.format][1]+'px';
 c.className='canvas'+(appState.customBgUrl?'':' bg-preset-'+appState.bgPreset);
 $('darkOverlay').style.opacity=appState.overlayOpacity;
 $('bgImageHolder').style.backgroundImage=appState.customBgUrl?`url("${appState.customBgUrl}")`:'none';
 layers.innerHTML='';
 appState.elements.forEach(el=>{
  const d=document.createElement('div');d.id=el.id;d.className=`draggable ${el.font} ${activeElementId===el.id?'active':''}`;
  Object.assign(d.style,{
   left:el.x+'px',
   top:el.y+'px',
   fontSize:el.size+'px',
   color:el.color,
   fontWeight:el.bold?'bold':'normal',
   fontStyle:el.italic?'italic':'normal',
   textAlign:el.align||'left'
  });
  d.textContent=el.content;layers.appendChild(d);
 });
 if(appState.seal.visible){
  const d=document.createElement('div');d.id='seal-element';d.className='draggable '+(activeElementId==='seal-element'?'active':'');
  Object.assign(d.style,{left:appState.seal.x+'px',top:appState.seal.y+'px',width:appState.seal.size+'px',height:appState.seal.size+'px',transform:`rotate(${appState.seal.rotate}deg)`});
  if(appState.seal.customUrl){const img=document.createElement('img');img.src=appState.seal.customUrl;img.style.cssText='width:100%;height:100%;object-fit:contain;pointer-events:none';d.appendChild(img)}
  else d.innerHTML=sealSVG[appState.seal.type]||sealSVG.wax;
  d.querySelector('svg')?.setAttribute('style','width:100%;height:100%');layers.appendChild(d);
 }
}

function renderControls(){
 const list=$('textControlsList');list.innerHTML='';
 appState.elements.forEach((el,i)=>{
  const box=document.createElement('div');box.className='panel';box.style.padding='9px';box.style.borderColor=activeElementId===el.id?'#d97706':'#334155';
  
  const title=document.createElement('div');title.style.cssText='display:flex;gap:6px;align-items:center;margin-bottom:7px';
  const num=document.createElement('span');num.textContent='#'+(i+1);num.style.color='#94a3b8';num.style.fontSize='12px';
  
  const textarea=document.createElement('textarea');textarea.value=el.content;textarea.style.cssText='flex:1;height:54px;font-size:12px';textarea.placeholder='Текст грамоты (можно вводить переносы строк)';
  textarea.addEventListener('input',()=>{
   el.content=textarea.value;
   const canvasText=$(el.id);if(canvasText)canvasText.textContent=textarea.value;
  });
  
  const del=document.createElement('button');del.textContent='✕';del.style.background='#7f1d1d';del.onclick=()=>removeText(el.id);
  title.append(num,textarea,del);box.append(title);
  
  const row=document.createElement('div');row.style.cssText='display:grid;grid-template-columns:1.5fr 1fr 1fr;gap:6px;margin-bottom:6px';
  const font=document.createElement('select');
  [['font-slavic','Славянский'],['font-gothic','Готика'],['font-handwrite','Рукописный'],['font-cinzel','Антиква'],['font-pixel','Пиксельный']].forEach(([v,t])=>{let o=document.createElement('option');o.value=v;o.textContent=t;font.append(o)});
  font.value=el.font;
  font.onchange=()=>{el.font=font.value;renderCanvas()};
  
  const size=document.createElement('input');size.type='number';size.min=8;size.max=160;size.value=el.size;
  size.onchange=()=>{el.size=Math.max(8,Math.min(160,Number(size.value)||8));renderCanvas()};
  
  const color=document.createElement('input');color.type='color';color.value=el.color;color.style.width='100%';
  color.oninput=()=>{el.color=color.value;const d=$(el.id);if(d)d.style.color=color.value};
  
  row.append(font,size,color);box.append(row);

  const rowStyle=document.createElement('div');rowStyle.style.cssText='display:flex;gap:6px;align-items:center';
  
  const btnBold=document.createElement('button');btnBold.textContent='B';btnBold.style.fontWeight='bold';btnBold.style.flex='1';btnBold.style.background=el.bold?'#d97706':'#334155';
  btnBold.onclick=()=>{
   el.bold=!el.bold;
   btnBold.style.background=el.bold?'#d97706':'#334155';
   const d=$(el.id);if(d)d.style.fontWeight=el.bold?'bold':'normal';
  };
  
  const btnItalic=document.createElement('button');btnItalic.textContent='I';btnItalic.style.fontStyle='italic';btnItalic.style.flex='1';btnItalic.style.background=el.italic?'#d97706':'#334155';
  btnItalic.onclick=()=>{
   el.italic=!el.italic;
   btnItalic.style.background=el.italic?'#d97706':'#334155';
   const d=$(el.id);if(d)d.style.fontStyle=el.italic?'italic':'normal';
  };
  
  rowStyle.append(btnBold,btnItalic);box.append(rowStyle);
  list.append(box);
 });
 $('sealAdjustments').style.display=appState.seal.visible?'block':'none';
 $('sealSizeVal').textContent=appState.seal.size+'px';$('sealRotateVal').textContent=appState.seal.rotate+'°';
}

function addText(){const id='el-'+Date.now();appState.elements.push({id,content:'Новый текст',font:'font-slavic',size:24,color:'#000000',x:150,y:150,bold:false,italic:false,align:'center'});activeElementId=id;renderApp()}
function removeText(id){appState.elements=appState.elements.filter(e=>e.id!==id);if(activeElementId===id)activeElementId=null;renderApp()}
function setPresetBg(p){appState.bgPreset=p;appState.customBgUrl=null;renderCanvas()}
function handleBgUpload(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{appState.customBgUrl=r.result;renderCanvas()};r.readAsDataURL(f)}
function changeFormat(){appState.format=$('aspectRatio').value;renderCanvas()}
function updateOverlay(v){appState.overlayOpacity=Number(v);$('darkOverlay').style.opacity=v}
function handleSealUpload(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{appState.seal.visible=true;appState.seal.customUrl=r.result;renderApp()};r.readAsDataURL(f)}
function setBuiltInSeal(t){appState.seal.visible=true;appState.seal.type=t;appState.seal.customUrl=null;renderApp()}
function updateSealSize(v){appState.seal.size=Number(v);const d=$('seal-element');if(d){d.style.width=v+'px';d.style.height=v+'px'}$('sealSizeVal').textContent=v+'px'}
function updateSealRotate(v){appState.seal.rotate=Number(v);const d=$('seal-element');if(d)d.style.transform=`rotate(${v}deg)`;$('sealRotateVal').textContent=v+'°'}
function removeSeal(){appState.seal.visible=false;renderApp()}

function applyPreset(p){
 if(!p)return;
 const data={
  hogwarts:{bg:'parchment',texts:[['ШКОЛА МАГИИ И ВОЛШЕБСТВА','font-gothic',32,'#2b0c0c',180,50,true,false],['Свидетельствует о том, что юный маг','font-handwrite',20,'#4a1515',220,130,false,false],['АЛЕКСАНДР БЛЕК','font-slavic',40,'#851414',230,190,true,false],['успешно сдал экзамены по дисциплине\n«Защита от Тёмных Искусств».','font-handwrite',22,'#1a0505',120,280,false,false]],seal:'wax'},
  military:{bg:'royal',texts:[['БОЕВОЙ УКАЗ №404','font-cinzel',36,'#f59e0b',230,50,true,false],['За проявленное мужество и отвагу в бою','font-slavic',20,'#e2e8f0',200,140,false,false],['КАПИТАН ВАЛЕНТАЙН','font-cinzel',38,'#ef4444',180,210,true,false]],seal:'gold'},
  scifi:{bg:'scifi',texts:[['PILOT LICENSE // SECTOR 7','font-pixel',20,'#22d3ee',150,60,false,false],['ID: #8940-EX-ORION','font-pixel',14,'#a855f7',240,140,false,false],['COMMANDER Shepard','font-cinzel',32,'#ffffff',200,220,true,false]],seal:'arcane'},
  guild:{bg:'parchment',texts:[['СВИДЕТЕЛЬСТВО ГИЛЬДИИ','font-cinzel',32,'#4a1515',180,55,true,false],['Настоящим подтверждается, что','font-handwrite',22,'#2b0c0c',220,140,false,false],['ИМЯ ПЕРСОНАЖА','font-gothic',42,'#851414',220,205,true,false],['принят в ряды гильдии\nи обладает всеми правами её члена.','font-slavic',20,'#1a0505',125,295,false,false]],seal:'gold'}
 };
 const d=data[p];if(!d)return;appState.bgPreset=d.bg;appState.customBgUrl=null;
 appState.elements=d.texts.map((t,i)=>({id:'el-'+(i+1),content:t[0],font:t[1],size:t[2],color:t[3],x:t[4],y:t[5],bold:t[6],italic:t[7],align:'center'}));
 appState.seal={visible:true,type:d.seal,customUrl:null,x:600,y:360,size:130,rotate:-8};activeElementId=null;$('templatePreset').value='';renderApp();
}

$('certificateContainer').addEventListener('pointerdown',e=>{
 const target=e.target.closest('.draggable');
 activeElementId=target?target.id:null;
 if(!target){renderCanvas();return}
 e.preventDefault();target.setPointerCapture?.(e.pointerId);
 const rect=target.getBoundingClientRect();drag={id:target.id,dx:e.clientX-rect.left,dy:e.clientY-rect.top};
 renderCanvas();
});
document.addEventListener('pointermove',e=>{
 if(!drag)return;const c=$('certificateContainer').getBoundingClientRect(),x=e.clientX-c.left-drag.dx,y=e.clientY-c.top-drag.dy;
 if(drag.id==='seal-element'){appState.seal.x=Math.round(x);appState.seal.y=Math.round(y)}
 else{const el=appState.elements.find(v=>v.id===drag.id);if(el){el.x=Math.round(x);el.y=Math.round(y)}}
 const d=$(drag.id);if(d){d.style.left=x+'px';d.style.top=y+'px'}
});
document.instanceListener||document.addEventListener('pointerup',()=>{if(drag){drag=null;renderControls()}});

async function exportPNG(){
 if(!window.html2canvas){alert('Не загрузилась библиотека экспорта. Обновите страницу и попробуйте снова.');return}
 const active=activeElementId;activeElementId=null;renderCanvas();
 try{const canvas=await html2canvas($('certificateContainer'),{scale:2,useCORS:true,backgroundColor:null});
 const a=document.createElement('a');a.download='certificate_'+Date.now()+'.png';a.href=canvas.toDataURL('image/png');a.click()}
 catch(err){console.error(err);alert('Не удалось создать PNG: '+err.message)}
 finally{activeElementId=active;renderCanvas()}
}
function openSupabaseModal(){$('sbUrl').value=localStorage.getItem('sb_url')||'';$('sbKey').value=localStorage.getItem('sb_key')||'';$('supabaseModal').style.display='flex'}
function closeSupabaseModal(){$('supabaseModal').style.display='none'}
function initSupabaseFromStorage(){try{const u=localStorage.getItem('sb_url'),k=localStorage.getItem('sb_key');supabaseClient=u&&k&&window.supabase?window.supabase.createClient(u,k):null}catch(e){console.error(e);supabaseClient=null}}
function saveSupabaseCredentials(){const u=$('sbUrl').value.trim(),k=$('sbKey').value.trim();if(!u||!k){alert('Заполните URL и Key');return}try{localStorage.setItem('sb_url',u);localStorage.setItem('sb_key',k);initSupabaseFromStorage();if(!supabaseClient)throw new Error('Не удалось создать подключение');closeSupabaseModal();alert('Настройки сохранены')}catch(e){alert('Ошибка настройки: '+e.message)}}
async function saveToSupabase(){if(!supabaseClient){alert('Сначала настройте Supabase');openSupabaseModal();return}const title=prompt('Название шаблона:','Грамота для ролевой');if(!title)return;try{const {error}=await supabaseClient.from('certificates').insert([{title,data:appState}]);if(error)throw error;alert('Шаблон сохранён')}catch(e){alert('Ошибка сохранения: '+e.message)}}
async function loadFromSupabase(){if(!supabaseClient){alert('Сначала настройте Supabase');openSupabaseModal();return}const list=$('supabaseItemsList');$('loadModal').style.display='flex';list.textContent='Загрузка…';try{const {data,error}=await supabaseClient.from('certificates').select('id,title,created_at,data').order('created_at',{ascending:false});if(error)throw error;list.innerHTML='';if(!data?.length){list.textContent='Сохранённых грамот пока нет';return}data.forEach(item=>{const row=document.createElement('div');row.style.cssText='display:flex;justify-content:space-between;gap:8px;padding:10px;border-bottom:1px solid #475569';const label=document.createElement('span');label.textContent=item.title+' — '+new Date(item.created_at).toLocaleString('ru-RU');const open=document.createElement('button');open.textContent='Открыть';open.style.background='#0891b2';open.onclick=()=>{appState=item.data;activeElementId=null;renderApp();closeLoadModal()};const del=document.createElement('button');del.textContent='Удалить';del.style.background='#7f1d1d';del.onclick=()=>deleteSupabaseItem(item.id);const actions=document.createElement('span');actions.append(open,del);row.append(label,actions);list.append(row)})}catch(e){list.textContent='Ошибка загрузки: '+e.message}}
function closeLoadModal(){$('loadModal').style.display='none'}
async function deleteSupabaseItem(id){if(!confirm('Удалить этот шаблон?'))return;try{const {error}=await supabaseClient.from('certificates').delete().eq('id',id);if(error)throw error;loadFromSupabase()}catch(e){alert('Ошибка удаления: '+e.message)}}
window.addEventListener('DOMContentLoaded',()=>{initSupabaseFromStorage();renderApp()});
</script>
</body></html>
